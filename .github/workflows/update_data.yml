name: Actualizar datos del BCRA

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (06:00 AM hora de Argentina)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para poder hacer commit/push de los cambios

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de descarga
        env:
          # Inyecta las variables de entorno desde los Secrets del repositorio si existen
          BCRA_API_TOKEN: ${{ secrets.BCRA_API_TOKEN }}
          BCRA_TOKEN_EXPIRATION_DATE: ${{ secrets.BCRA_TOKEN_EXPIRATION_DATE }}
        run: python fetch_data.py

      - name: Commit y Push de los datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bcra_data.json
          if ! git diff --cached --exit-code; then
            git commit -m "Auto-actualización de datos del BCRA [skip ci]"
            git push
          else
            echo "No hay cambios en los datos para commitear."
          fi
