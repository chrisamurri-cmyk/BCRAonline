name: Actualizar datos del BCRA e IA

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # NUEVO PASO: Instalamos la librería de Google para que el script no falle
      - name: Instalar dependencias
        run: pip install google-generativeai

      - name: Ejecutar script de descarga
        # AGREGAMOS LAS LLAVES AQUÍ:
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BCRA_API_TOKEN: ${{ secrets.BCRA_API_TOKEN }} # Por si usás el token del BCRA
        run: python fetch_data.py

      - name: Commit y Push de los datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bcra_data.json
          if ! git diff --cached --exit-code; then
            git commit -m "Auto-actualización de datos del BCRA e informe IA [skip ci]"
            git push
          else
            echo "No hay cambios en los datos para commitear."
          fi
