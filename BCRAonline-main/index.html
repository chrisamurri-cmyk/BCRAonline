<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BCRAonline — Variables económicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161d;
      --border:    #1e2330;
      --text:      #e8eaf0;
      --muted:     #5a6080;
      --accent:    #3d8bff;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 0;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .logo { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    #last-update { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    #status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    #status-dot.live { background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
    h1 { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 40px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; position: relative; }
    .card-label { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }
    .card-value { font-family: var(--mono); font-size: 28px; font-weight: 500; color: var(--text); }
    .card-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .card-change { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .change-up { background: rgba(34,197,94,0.1); color: var(--green); }
    .change-down { background: rgba(239,68,68,0.1); color: var(--red); }
    .card-tag { position: absolute; top: 16px; right: 16px; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .tag-blue { background: rgba(61,139,255,0.12); color: var(--accent); }
    .tag-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
    .tag-green { background: rgba(34,197,94,0.12); color: var(--green); }
    .tag-red { background: rgba(239,68,68,0.12); color: var(--red); }

    .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 40px; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .chart-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .chart-tabs { display: flex; gap: 6px; }
    .chart-tab, .range-tab { font-size: 11px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
    .chart-tab.active, .range-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(61,139,255,0.1); }

    .table-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .table-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px 24px; font-size: 11px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 12px 24px; font-family: var(--mono); font-size: 13px; border-bottom: 1px solid var(--border); }
    
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 48px 24px; border-top: 1px solid var(--border); }
    footer a { color: var(--accent); text-decoration: none; }
    .skeleton { background: #1e2330; height: 28px; width: 100px; border-radius: 4px; animation: pulse 2s infinite; }
  </style>
</head>
<body>

<header>
  <a href="./" class="logo">BCRA<span>online</span></a>
  <div id="last-update"><span id="status-dot"></span>Cargando...</div>
</header>

<main>
  <h1>Variables del Banco Central · Argentina</h1>

  <!-- SECCIÓN DE ANÁLISIS IA (TÍTULO DINÁMICO) -->
  <section id="ai-container" style="display: none; background: #1a1d24; border-left: 4px solid #00f3ff; padding: 20px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <h3 style="color: #00f3ff; margin-top: 0; font-size: 16px; font-family: 'Inter', sans-serif;">🤖 Resumen del día</h3>
    <div id="ai-text" style="line-height: 1.6; font-size: 14px; color: #e0e0e0; white-space: pre-wrap; font-family: 'Inter', sans-serif;">
      Cargando informe inteligente...
    </div>
  </section>
  
  <div class="grid" id="cards-grid"></div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title">Evolución histórica</div>
      <div class="chart-controls" style="display: flex; gap: 12px; flex-wrap: wrap;">
        <div class="chart-tabs" id="chart-tabs">
          <button class="chart-tab active" data-var="1" data-label="Reservas (USD M)">Reservas</button>
          <button class="chart-tab" data-var="4" data-label="TC Oficial ($/USD)">Dólar</button>
          <button class="chart-tab" data-var="7" data-label="BADLAR (%)">BADLAR</button>
          <button class="chart-tab" data-var="15" data-label="Base Monetaria (M$)">Base M.</button>
          <button class="chart-tab" data-var="27" data-label="Inflación (%)">IPC</button>
        </div>
        <div class="chart-tabs" id="range-tabs">
          <button class="range-tab" data-days="30">30d</button>
          <button class="range-tab" data-days="90">90d</button>
          <button class="range-tab active" data-days="180">6M</button>
          <button class="range-tab" data-days="365">1A</button>
        </div>
      </div>
    </div>
    <canvas id="main-chart" height="280"></canvas>
  </div>

  <div class="table-section">
    <div class="table-header">
      <span>Últimos registros — <span id="table-var-label">Reservas internacionales</span></span>
      <button id="btn-csv" style="background:none; border:1px solid var(--border); color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:4px; font-size:11px;">⬇ CSV</button>
    </div>
    <table>
      <thead><tr><th>Fecha</th><th>Valor</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<footer>
  Datos: <a href="https://www.bcra.gob.ar" target="_blank">BCRA</a> · 
  Análisis: <a href="https://deepmind.google/technologies/gemini/" target="_blank">Gemini AI</a> · 
  Fuente abierta en <a href="https://github.com/chrisamurri-cmyk/BCRAonline" target="_blank">GitHub</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
const VARIABLES = [
  { id: 1,  label: 'Reservas internacionales', unit: 'USD M', tag: 'tag-blue',  format: v => formatNum(v) },
  { id: 4,  label: 'Tipo de cambio oficial',     unit: '$/USD', tag: 'tag-amber', format: v => '$' + formatDec(v) },
  { id: 7,  label: 'BADLAR bancos privados',     unit: '% TNA', tag: 'tag-green', format: v => formatDec(v) + '%' },
  { id: 15, label: 'Base monetaria',             unit: 'MM$',   tag: 'tag-blue',  format: v => formatNum(v) },
  { id: 27, label: 'Inflación mensual',          unit: '%',     tag: 'tag-red',   format: v => formatDec(v) + '%' },
  { id: 16, label: 'Circulación monetaria',      unit: 'MM$',   tag: 'tag-blue',  format: v => formatNum(v) },
  { id: 8,  label: 'TM20 bancos privados',       unit: '% TNA', tag: 'tag-green', format: v => formatDec(v) + '%' },
  { id: 12, label: 'Depósitos a 30 días',        unit: '% TNA', tag: 'tag-green', format: v => formatDec(v) + '%' }
];

function formatNum(v) { return v >= 1_000_000 ? (v / 1_000_000).toFixed(2) + 'B' : v.toLocaleString('es-AR'); }
function formatDec(v) { return parseFloat(v).toLocaleString('es-AR', { minimumFractionDigits: 2 }); }
function formatDate(d) { if(!d) return '—'; const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }

let cacheData = null;
let chartInstance = null;
let activeVarId = 1;
let activeRange = 180;

async function loadData() {
  try {
    const res = await fetch('data/bcra_data.json');
    cacheData = await res.json();

    // --- MOSTRAR IA ---
    if (cacheData.ai_analysis && !cacheData.ai_analysis.includes("no pudo")) {
      document.getElementById('ai-container').style.display = 'block';
      document.getElementById('ai-text').innerText = cacheData.ai_analysis;
      document.querySelector('#ai-container h3').innerText = `🤖 ${cacheData.ai_title || 'Resumen del día'}`;
    }

    const byId = {};
    cacheData.variables.forEach(d => { byId[d.idVariable] = d; });

    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '';
    VARIABLES.forEach(v => {
      const d = byId[v.id];
      if (d) {
        grid.innerHTML += `
          <div class="card">
            <div class="card-label">${v.label}</div>
            <div class="card-value">${v.format(d.ultValorInformado)}</div>
            <div class="card-sub">${v.unit} · ${formatDate(d.ultFechaInformada)}</div>
            <span class="card-tag ${v.tag}">${v.id === 4 ? 'FX' : 'Stock'}</span>
          </div>`;
      }
    });

    if (cacheData.metadata.last_update) {
      const date = new Date(cacheData.metadata.last_update);
      document.getElementById('last-update').innerHTML = `<span id="status-dot" class="live"></span> Actualizado: ${date.toLocaleString('es-AR')}`;
    }

    updateChart(activeVarId);
  } catch (e) { console.error(e); }
}

function updateChart(varId) {
  const history = cacheData.history[varId].slice(-activeRange);
  const labels = history.map(h => formatDate(h.fecha));
  const values = history.map(h => h.valor);

  const ctx = document.getElementById('main-chart').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#3d8bff',
        backgroundColor: 'rgba(61,139,255,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#5a6080', maxTicksLimit: 6 } },
        y: { grid: { color: '#1e2330' }, ticks: { color: '#5a6080' } }
      }
    }
  });

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = history.slice(-10).reverse().map(h => `<tr><td>${formatDate(h.fecha)}</td><td>${formatDec(h.valor)}</td></tr>`).join('');
}

document.getElementById('chart-tabs').addEventListener('click', e => {
  if (e.target.dataset.var) {
    document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeVarId = e.target.dataset.var;
    document.getElementById('table-var-label').innerText = e.target.dataset.label;
    updateChart(activeVarId);
  }
});

document.getElementById('range-tabs').addEventListener('click', e => {
  if (e.target.dataset.days) {
    document.querySelectorAll('.range-tab').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeRange = parseInt(e.target.dataset.days);
    updateChart(activeVarId);
  }
});

loadData();
</script>
</body>
</html>
